# pnpm 설정 파일. 워크스페이스 용도가 아니라 allowBuilds 설정을 담기 위한 파일이다.
# pnpm은 의존성의 라이프사이클 스크립트를 기본 차단하며, strictDepBuilds 기본값이 true라
# 미검토 항목이 남아 있으면 pnpm install이 non-zero로 종료한다.
allowBuilds:
  # libvips 바이너리를 받아온다. 없으면 썸네일 생성기가 런타임에 실패한다.
  sharp: true
  # 플랫폼 바이너리를 설치한다. 없으면 Nuxt 빌드가 불가능하다.
  esbuild: true
  # prebuild가 없을 때 소스에서 빌드한다. dev 파일 감시에 쓰인다.
  '@parcel/watcher': true
  # 설치된 Vue 버전에 맞춰 dist를 교체한다.
  vue-demi: true
  # 스크립트 내용이 cli/node_modules 디렉토리 생성과 버전 스킴 경고뿐이다.
  protobufjs: false
  # Sysinternals du(Windows 전용)를 내려받는다. @nuxt/devtools 의존성이라 macOS/Linux에선 무의미하다.
  fast-folder-size: false
