      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup은 반드시 setup-node보다 먼저 온다. 아래 cache: pnpm이
      # store 경로를 pnpm에게 물어보기 때문이다.
